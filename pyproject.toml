[project]
name = "keepdrive"
version = "1.0.0"
requires-python = ">=3.13"

dependencies = [
    "gkeepapi>=0.17.1",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "gpsoauth>=2.0.0",
    "playwright>=1.49.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10.1",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["app", "service", "utils", "tests"]
exclude = ["scripts"]
reportMissingTypeStubs = false
reportUnusedVariable = true
reportUnusedImport = true

